org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Project lives on D: but the Pub cache (plugin sources) is on C:. Kotlin's
# incremental compiler can't relativize paths across Windows drive roots and
# crashes ("different roots: C:\... and D:\..."), so disable it.
kotlin.incremental=false
