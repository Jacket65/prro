name: prro
description: "Flutter POS application with real and mock backend environments"
publish_to: "none"
version: 1.0.0+1

environment:
  # The *effective* floor is Dart 3.13 / Flutter 3.47, enforced by the
  # dependencies themselves (`material_ui` declares `flutter: ">=3.47.0"`,
  # `freezed` 4 and `very_good_analysis` 11 declare `sdk: ^3.13.0`) and
  # recorded in pubspec.lock. Do NOT raise this to `>=3.13.0`: with
  # `analyzer` 13.3.0 that makes the analyzer silently stop applying
  # `very_good_analysis`, so `flutter analyze` reports ~355 default-lint infos
  # and fails. CI pins Flutter 3.47.5 to satisfy the real floor.
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  app_links: ^7.2.1
  auto_route: 11.2.0
  bloc_concurrency: ^0.3.0
  decimal: ^3.2.6
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  flutter_slidable: ^4.0.3
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.5.0

  meta: ^1.19.0
  shared_preferences: ^2.5.5
  talker: ^5.1.20
  url_launcher: ^6.3.2

dev_dependencies:
  app_links_platform_interface: ^2.0.4
  auto_route_generator: ^10.6.0
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true