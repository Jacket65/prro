name: prro
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  app_links: ^7.2.1
  # auto_route 11.2.0 imports package:material_ui, which is a separate copy of
  # Material. Until the Flutter SDK re-exports material_ui from
  # package:flutter/material.dart, auto_route's TabController is a different
  # type from the app's, breaking AutoTabsRouter.tabBar builders.
  auto_route: ">=11.1.0 <11.2.0"
  bloc_concurrency: ^0.3.0
  cupertino_icons: ^2.0.0
  decimal: ^3.2.6
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  flutter_slidable: ^4.0.3
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  http: ^1.6.0
  injectable: ^3.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  meta: ^1.19.0
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  talker: ^5.1.20
  talker_bloc_logger: ^5.1.20
  url_launcher: ^6.3.2

dev_dependencies:
  auto_route_generator: ^10.6.0
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # freezed 4.0.2+ requires analyzer 14, which no auto_route_generator release
  # supports yet (<14), so resolution fails above 4.0.1.
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true